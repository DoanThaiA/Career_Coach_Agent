<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Agent — Test UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-card: #22223a;
            --bg-input: #2a2a42;
            --text-primary: #e8e8f0;
            --text-secondary: #9a9ab0;
            --text-muted: #6b6b80;
            --accent: #6c5ce7;
            --accent-hover: #7f70f0;
            --accent-glow: rgba(108, 92, 231, 0.25);
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --border: rgba(255,255,255,0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .app { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
        header { text-align: center; margin-bottom: 36px; }
        header h1 {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #74b9ff);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        header p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
            transition: border-color 0.3s;
        }
        .card:hover { border-color: rgba(108,92,231,0.2); }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card h2 .icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
        
        .icon-cv   { background: rgba(0,184,148,0.15); color: var(--success); }
        .icon-jd   { background: rgba(108,92,231,0.15); color: var(--accent); }
        .icon-chat { background: rgba(116,185,255,0.15); color: #74b9ff; }
        .icon-report { background: rgba(253,203,110,0.15); color: var(--warning); }

        label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, select {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text-primary);
            font-family: inherit; font-size: 0.88rem; outline: none; margin-bottom: 14px;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .upload-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .upload-row input[type="file"] { margin-bottom: 0; flex: 1; padding: 7px; }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 22px; border: none; border-radius: var(--radius-sm);
            font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #7f70f0); color: white; box-shadow: 0 4px 16px var(--accent-glow); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); width: auto; padding: 7px 14px; }
        .btn-outline:hover { background: rgba(108,92,231,0.1); }
        .btn-send { background: linear-gradient(135deg, var(--success), #55efc4); color: #0f0f14; }

        .status-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 20px; }
        .status-pill { padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .pill-idle { background: rgba(255,255,255,0.06); color: var(--text-muted); }
        .pill-interviewing { background: rgba(108,92,231,0.15); color: var(--accent); }
        .pill-completed { background: rgba(0,184,148,0.15); color: var(--success); }
        .pill-error { background: rgba(225,112,85,0.15); color: var(--danger); }
        .status-info { font-size: 0.82rem; color: var(--text-secondary); }

        .chat-area { grid-column: 1 / -1; }
        .messages { background: var(--bg-card); border-radius: var(--radius); padding: 20px; min-height: 300px; max-height: 480px; overflow-y: auto; margin-bottom: 16px; border: 1px solid var(--border); }
        .msg { margin-bottom: 16px; display: flex; gap: 10px; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
        .msg-ai .msg-avatar { background: linear-gradient(135deg, var(--accent), #a29bfe); color: white; }
        .msg-human .msg-avatar { background: linear-gradient(135deg, var(--success), #55efc4); color: #0f0f14; }
        .msg-system .msg-avatar { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .msg-body { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 10px 14px; max-width: 80%; font-size: 0.88rem; line-height: 1.65; }
        .msg-human .msg-body { background: rgba(0,184,148,0.1); margin-left: auto; }
        .msg-system .msg-body { background: transparent; font-size: 0.8rem; color: var(--text-secondary); font-style: italic; }
        
        .answer-row { display: flex; gap: 12px; }
        .answer-row textarea { flex: 1; min-height: 50px; margin-bottom: 0; }
        .answer-row .btn { width: auto; min-width: 110px; }

        .report-section { grid-column: 1 / -1; }
        .report-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; font-size: 0.88rem; line-height: 1.7; white-space: pre-wrap; }
        .decision-badge { display: inline-block; padding: 6px 20px; border-radius: 8px; font-weight: 700; margin: 10px 0; }
        .decision-Pass { background: rgba(0,184,148,0.15); color: var(--success); border: 1px solid rgba(0,184,148,0.3); }
        .decision-Fail { background: rgba(225,112,85,0.15); color: var(--danger); border: 1px solid rgba(225,112,85,0.3); }
        .decision-Consider { background: rgba(253,203,110,0.15); color: var(--warning); border: 1px solid rgba(253,203,110,0.3); }

        .hidden { display: none !important; }
        .json-toggle { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 4px 12px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; transition: all 0.2s; }
        .json-toggle:hover { color: var(--text-primary); border-color: var(--accent); }
        .json-preview { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; font-family: monospace; font-size: 0.72rem; color: var(--text-secondary); max-height: 250px; overflow: auto; white-space: pre; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: currentColor; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .upload-status { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>🎤 Interview Agent — Test Console</h1>
            <p>Upload CV/JD và bắt đầu phỏng vấn</p>
        </header>

        <div class="status-bar" id="statusBar">
            <span class="status-pill pill-idle" id="statusPill">IDLE</span>
            <span class="status-info" id="statusText">Chưa bắt đầu phiên phỏng vấn</span>
        </div>

        <div style="height: 20px;"></div>

        <div class="grid" id="setupSection">
            <!-- CV Card -->
            <div class="card">
                <h2><span class="icon icon-cv">📄</span> 1. Chọn hoặc Upload CV</h2>
                <label>Chọn CV đã có trong hệ thống</label>
                <select id="cvSelect" onchange="handleSelectCv()">
                    <option value="">-- Đang tải danh sách CV... --</option>
                </select>
                
                <label style="margin-top: 15px;">Hoặc Upload CV Mới</label>
                <div class="upload-row">
                    <input type="file" id="cvFile" accept=".pdf,.docx,.txt">
                    <button class="btn btn-outline" id="cvUploadBtn" onclick="uploadDoc('cv')">Upload</button>
                </div>
                <div id="cvUploadStatus" class="upload-status"></div>

                <div style="margin-top: 15px;">
                    <button class="json-toggle" onclick="togglePreview('cvPreview')">👁 Xem trước dữ liệu CV (JSON)</button>
                    <div class="json-preview hidden" id="cvPreview">Chưa chọn CV nào.</div>
                </div>
            </div>

            <!-- JD Card -->
            <div class="card">
                <h2><span class="icon icon-jd">📋</span> 2. Chọn hoặc Upload JD</h2>
                <label>Chọn JD đã có trong hệ thống</label>
                <select id="jdSelect" onchange="handleSelectJd()">
                    <option value="">-- Đang tải danh sách JD... --</option>
                </select>
                
                <label style="margin-top: 15px;">Hoặc Upload JD Mới</label>
                <div class="upload-row">
                    <input type="file" id="jdFile" accept=".pdf,.docx,.txt">
                    <button class="btn btn-outline" id="jdUploadBtn" onclick="uploadDoc('jd')">Upload</button>
                </div>
                <div id="jdUploadStatus" class="upload-status"></div>

                <div style="margin-top: 15px;">
                    <button class="json-toggle" onclick="togglePreview('jdPreview')">👁 Xem trước dữ liệu JD (JSON)</button>
                    <div class="json-preview hidden" id="jdPreview">Chưa chọn JD nào.</div>
                </div>
            </div>
        </div>

        <div style="height: 16px;" id="startBtnSpacer"></div>

        <div id="startBtnContainer">
            <button class="btn btn-primary" id="startBtn" onclick="startInterview()" disabled>
                🚀 Bắt đầu Phỏng vấn (Vui lòng chọn CV và JD)
            </button>
        </div>

        <div style="height: 24px;"></div>

        <!-- Chat & Report Sections -->
        <div class="grid">
            <div class="card chat-area hidden" id="chatSection">
                <h2><span class="icon icon-chat">💬</span> Phòng Phỏng vấn</h2>
                <div class="messages" id="chatMessages"></div>
                <div class="answer-row">
                    <textarea id="answerInput" placeholder="Nhập câu trả lời của bạn..." onkeydown="handleAnswerKey(event)"></textarea>
                    <button class="btn btn-send" id="sendBtn" onclick="sendAnswer()">➤ Gửi</button>
                </div>
            </div>

            <div class="card report-section hidden" id="reportSection">
                <h2><span class="icon icon-report">📊</span> Kết quả Phỏng vấn</h2>
                <div id="reportContent" class="report-content"></div>
            </div>
        </div>
    </div>

    <script>
        const API_DOCS_BASE = window.location.origin + '/api/v1/documents';
        const API_INTERVIEW_BASE = window.location.origin + '/api/v1/interview';
        
        let currentCvData = null;
        let currentJdData = null;
        let currentThreadId = null;
        let isProcessing = false;

        function $(id) { return document.getElementById(id); }

        // --- Initialization ---
        window.onload = async () => {
            const threadId = sessionStorage.getItem('interview_thread_id');
            if (threadId) {
                currentThreadId = threadId;
                $('chatSection').classList.remove('hidden');
                $('setupSection').style.display = 'none';
                $('startBtnContainer').style.display = 'none';
                $('startBtnSpacer').style.display = 'none';
                
                // Retrieve initial question from sessionStorage (set by dashboard)
                const firstQuestion = sessionStorage.getItem('first_question');
                if (firstQuestion) {
                    // Create a mock response object to trigger handleResponse correctly
                    const mockData = {
                        status: 'interviewing',
                        question: firstQuestion,
                        topic_index: 0,
                        total_topics: 3,
                        current_topic: "Bắt đầu phỏng vấn"
                    };
                    handleResponse(mockData);
                    sessionStorage.removeItem('first_question'); // Only show once
                } else {
                    // If no first_question, try to fetch status
                    try {
                        const res = await fetch(`${API_INTERVIEW_BASE}/status/${threadId}`);
                        const data = await res.json();
                        if (res.ok) handleResponse(data);
                    } catch(e) {
                        setStatus('error', `Lỗi khôi phục: ${e.message}`);
                    }
                }
                return;
            }

            await Promise.all([fetchCvs(), fetchJds()]);
            checkReadyState();
        };

        async function fetchCvs() {
            try {
                const res = await fetch(`${API_DOCS_BASE}/cvs`);
                const data = await res.json();
                const select = $('cvSelect');
                select.innerHTML = '<option value="">-- Chọn CV --</option>';
                data.data.forEach(cv => {
                    select.innerHTML += `<option value="${cv.id}">${cv.name}</option>`;
                });
            } catch (e) {
                console.error("Lỗi tải danh sách CV:", e);
                $('cvSelect').innerHTML = '<option value="">Lỗi tải dữ liệu!</option>';
            }
        }

        async function fetchJds() {
            try {
                const res = await fetch(`${API_DOCS_BASE}/jds`);
                const data = await res.json();
                const select = $('jdSelect');
                select.innerHTML = '<option value="">-- Chọn JD --</option>';
                data.data.forEach(jd => {
                    select.innerHTML += `<option value="${jd.id}">${jd.title}</option>`;
                });
            } catch (e) {
                console.error("Lỗi tải danh sách JD:", e);
                $('jdSelect').innerHTML = '<option value="">Lỗi tải dữ liệu!</option>';
            }
        }

        // --- Select & Fetch Details ---
        async function handleSelectCv() {
            const id = $('cvSelect').value;
            if (!id) {
                currentCvData = null;
                $('cvPreview').textContent = "Chưa chọn CV nào.";
                checkReadyState();
                return;
            }
            $('cvPreview').innerHTML = '<span class="spinner"></span> Đang tải...';
            try {
                const res = await fetch(`${API_DOCS_BASE}/cvs/${id}`);
                const data = await res.json();
                // Loại bỏ object _id của mongo nếu có
                const cleanData = { ...data.data };
                delete cleanData._id;
                delete cleanData.task_id;
                delete cleanData.original_file_path;
                
                currentCvData = cleanData;
                $('cvPreview').textContent = JSON.stringify(currentCvData, null, 2);
            } catch (e) {
                $('cvPreview').textContent = "Lỗi tải dữ liệu CV!";
            }
            checkReadyState();
        }

        async function handleSelectJd() {
            const id = $('jdSelect').value;
            if (!id) {
                currentJdData = null;
                $('jdPreview').textContent = "Chưa chọn JD nào.";
                checkReadyState();
                return;
            }
            $('jdPreview').innerHTML = '<span class="spinner"></span> Đang tải...';
            try {
                const res = await fetch(`${API_DOCS_BASE}/jds/${id}`);
                const data = await res.json();
                const cleanData = { ...data.data };
                delete cleanData._id;
                delete cleanData.task_id;
                delete cleanData.original_file_path;
                
                currentJdData = cleanData;
                $('jdPreview').textContent = JSON.stringify(currentJdData, null, 2);
            } catch (e) {
                $('jdPreview').textContent = "Lỗi tải dữ liệu JD!";
            }
            checkReadyState();
        }

        function checkReadyState() {
            const btn = $('startBtn');
            if (currentCvData && currentJdData) {
                btn.disabled = false;
                btn.innerHTML = '🚀 Bắt đầu Phỏng vấn';
            } else {
                btn.disabled = true;
                btn.innerHTML = '🚀 Bắt đầu Phỏng vấn (Vui lòng chọn CV và JD)';
            }
        }

        // --- Upload & Polling ---
        async function uploadDoc(type) {
            const fileInput = $(`${type}File`);
            const statusEl = $(`${type}UploadStatus`);
            const btn = $(`${type}UploadBtn`);
            
            if (!fileInput.files.length) {
                alert("Vui lòng chọn file trước!");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('doc_type', type);

            btn.disabled = true;
            statusEl.innerHTML = '<span class="spinner"></span> Đang upload...';

            try {
                const res = await fetch(`${API_DOCS_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok && data.task_id) {
                    statusEl.innerHTML = '<span class="spinner"></span> Upload xong, đang dùng AI trích xuất...';
                    pollTask(data.task_id, type, statusEl, btn);
                } else {
                    throw new Error(data.detail || 'Upload thất bại');
                }
            } catch (e) {
                statusEl.innerHTML = `<span style="color: var(--danger)">❌ Lỗi: ${e.message}</span>`;
                btn.disabled = false;
            }
        }

        async function pollTask(taskId, type, statusEl, btn) {
            try {
                const res = await fetch(`${API_DOCS_BASE}/tasks/${taskId}`);
                const data = await res.json();
                
                if (data.status === 'SUCCESS') {
                    statusEl.innerHTML = `<span style="color: var(--success)">✅ Trích xuất thành công!</span>`;
                    btn.disabled = false;
                    $(`${type}File`).value = ''; // clear input
                    
                    // Refresh list and auto select the newest
                    if (type === 'cv') {
                        await fetchCvs();
                        const select = $('cvSelect');
                        if (select.options.length > 1) {
                            select.selectedIndex = 1; // Mới nhất thường nằm đầu do sort(-1)
                            handleSelectCv();
                        }
                    } else {
                        await fetchJds();
                        const select = $('jdSelect');
                        if (select.options.length > 1) {
                            select.selectedIndex = 1;
                            handleSelectJd();
                        }
                    }
                } else if (data.status === 'FAILURE' || data.status === 'REVOKED') {
                    statusEl.innerHTML = `<span style="color: var(--danger)">❌ Lỗi khi xử lý: ${data.error || 'Unknown'}</span>`;
                    btn.disabled = false;
                } else {
                    // Tiếp tục poll
                    setTimeout(() => pollTask(taskId, type, statusEl, btn), 2000);
                }
            } catch (e) {
                statusEl.innerHTML = `<span style="color: var(--danger)">❌ Lỗi kết nối khi check status</span>`;
                btn.disabled = false;
            }
        }

        // --- Interview Flow (Kept mostly intact) ---
        function setStatus(status, text) {
            const pill = $('statusPill');
            pill.className = `status-pill pill-${status}`;
            pill.textContent = status.toUpperCase();
            $('statusText').innerHTML = text;
        }

        function togglePreview(id) {
            const el = $(id);
            el.classList.toggle('hidden');
        }

        function addMessage(type, content, meta = '') {
            const container = $('chatMessages');
            const avatarMap = { ai: 'AI', human: 'Bạn', system: '⚙' };
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            div.innerHTML = `
                <div class="msg-avatar">${avatarMap[type] || '?'}</div>
                <div>
                    <div class="msg-body">${escapeHtml(content)}</div>
                    ${meta ? `<div class="msg-meta">${meta}</div>` : ''}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function setLoading(loading) {
            isProcessing = loading;
            $('sendBtn').disabled = loading;
            if (loading) $('sendBtn').innerHTML = '<span class="spinner"></span> Đang xử lý...';
            else $('sendBtn').innerHTML = '➤ Gửi';
        }

        async function startInterview() {
            if (isProcessing || !currentCvData || !currentJdData) return;
            setLoading(true);

            try {
                const res = await fetch(`${API_INTERVIEW_BASE}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cv_parsed: currentCvData,
                        jd_parsed: currentJdData
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Unknown error');

                currentThreadId = data.thread_id;
                $('chatSection').classList.remove('hidden');
                $('setupSection').style.display = 'none';
                $('startBtnContainer').style.display = 'none';
                $('startBtnSpacer').style.display = 'none';

                handleResponse(data);
            } catch (e) {
                setStatus('error', `Lỗi khởi tạo: ${e.message}`);
            }
            setLoading(false);
        }

        async function sendAnswer() {
            if (isProcessing || !currentThreadId) return;
            const answer = $('answerInput').value.trim();
            if (!answer) return;

            addMessage('human', answer);
            $('answerInput').value = '';
            setLoading(true);

            try {
                const res = await fetch(`${API_INTERVIEW_BASE}/answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ thread_id: currentThreadId, answer: answer })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Unknown error');
                handleResponse(data);
            } catch (e) {
                addMessage('system', `❌ Lỗi: ${e.message}`);
            }
            setLoading(false);
            $('answerInput').focus();
        }

        function handleResponse(data) {
            if (data.status === 'interviewing') {
                const topicInfo = data.current_topic ? `Chủ đề <strong>${data.topic_index + 1}/${data.total_topics}</strong>: ${data.current_topic}` : '';
                setStatus('interviewing', topicInfo);
                if (data.question) addMessage('ai', data.question, data.current_topic ? `📌 ${data.current_topic}` : '');
            } else if (data.status === 'completed') {
                setStatus('completed', `Phỏng vấn hoàn tất — Kết quả: <strong>${data.final_decision}</strong>`);
                addMessage('system', `✅ Phỏng vấn kết thúc. Kết quả: ${data.final_decision}`);
                $('reportSection').classList.remove('hidden');
                $('reportContent').innerHTML = `<span class="decision-badge decision-${data.final_decision}">${data.final_decision}</span>\n` + (data.report || '');
                $('answerInput').disabled = true;
                $('sendBtn').disabled = true;
            } else if (data.status === 'error') {
                setStatus('error', data.error || 'Đã xảy ra lỗi');
                addMessage('system', `❌ ${data.error || 'Lỗi không xác định'}`);
            }
        }

        function handleAnswerKey(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                sendAnswer();
            }
        }
    </script>
</body>
</html>
